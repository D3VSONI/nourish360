kind = "web"
previewPath = "/"
title = "Nourish360"
description = "Offline-first maternal and child health workflow demo for Sonipat, with synthetic longitudinal cases and simulated emergency tracking."
version = "1.0.0"
id = "artifacts/nourish360"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20154

[services.development]
run = "pnpm --filter @workspace/nourish360 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nourish360", "run", "build" ]
serve = "static"
publicDir = "artifacts/nourish360/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20154"
BASE_PATH = "/"
